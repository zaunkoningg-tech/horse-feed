name: Check stock

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check stock and notify
        run: node scripts/check-stock.js
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ vars.GIST_ID }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}

      - name: Keep-alive commit on the 1st of the month
        run: |
          if [ "$(date +%d)" = "01" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keep-alive"
            git push
          fi
